<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>privacy·ping — local ping test</title>
  <style>
    /* ----- global reset & design tokens ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f8faff;
      --surface: #ffffff;
      --text: #1a1e2b;
      --text-soft: #4a4f60;
      --border: #dde2ed;
      --accent: #2b5fe0;
      --accent-soft: #e8edfe;
      --success: #0f7b4b;
      --warning: #b45309;
      --error: #b91c1c;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.02);
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Roboto Mono', monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1219;
        --surface: #1a1e28;
        --text: #edeff5;
        --text-soft: #a8afc0;
        --border: #2e3443;
        --accent: #6d8eff;
        --accent-soft: #232b42;
        --success: #2e9e6d;
        --warning: #d98f2c;
        --error: #e05a5a;
        --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background 0.15s ease, color 0.15s ease;
      line-height: 1.5;
    }

    /* ----- main card ----- */
    .ping-card {
      max-width: 760px;
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 2rem 2.25rem;
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
    }

    @media (max-width: 540px) {
      body {
        padding: 0.75rem;
      }
      .ping-card {
        padding: 1.5rem 1.25rem 1.75rem;
        border-radius: var(--radius-sm);
      }
    }

    /* ----- header ----- */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }

    .shield-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 620;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .privacy-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.2rem 0.7rem;
      border-radius: 100px;
      margin-left: auto;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .subhead {
      color: var(--text-soft);
      font-size: 0.92rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .subhead .dot {
      width: 4px;
      height: 4px;
      background: var(--text-soft);
      border-radius: 50%;
      display: inline-block;
      opacity: 0.5;
    }

    /* ----- input area ----- */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 560px) {
      .input-group {
        flex-direction: row;
        align-items: center;
      }
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-family: var(--font-mono);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 100px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }

    .input-wrapper input::placeholder {
      color: var(--text-soft);
      opacity: 0.6;
      font-family: var(--font-sans);
      font-size: 0.95rem;
    }

    .ping-button {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      white-space: nowrap;
      box-shadow: 0 4px 12px -4px rgba(43, 95, 224, 0.35);
    }

    .ping-button:hover:not(:disabled) {
      background: #1f4bc7;
    }

    .ping-button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .ping-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (prefers-color-scheme: dark) {
      .ping-button {
        box-shadow: 0 4px 12px -4px rgba(109, 142, 255, 0.3);
      }
      .ping-button:hover:not(:disabled) {
        background: #5a7bef;
      }
    }

    /* ----- progress / status row ----- */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 2rem;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .status-message {
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-soft);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .badge-success,
    .badge-error {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.75rem;
      border-radius: 100px;
      letter-spacing: 0.01em;
    }

    .badge-success {
      background: rgba(15, 123, 75, 0.12);
      color: var(--success);
    }

    .badge-error {
      background: rgba(185, 28, 28, 0.1);
      color: var(--error);
    }

    @media (prefers-color-scheme: dark) {
      .badge-success {
        background: rgba(46, 158, 109, 0.18);
      }
      .badge-error {
        background: rgba(224, 90, 90, 0.18);
      }
    }

    /* ----- results area ----- */
    .results-panel {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
    }

    @media (max-width: 480px) {
      .results-panel {
        padding: 1rem 1rem;
      }
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-soft);
      font-weight: 600;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .results-header span:last-child {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0.02em;
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 520px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.65rem;
      }
    }

    .stat-item {
      background: var(--surface);
      border-radius: 10px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-soft);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .stat-value.small {
      font-size: 1rem;
    }

    .stat-unit {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-soft);
      margin-left: 0.15rem;
    }

    .progress-track {
      margin: 0.5rem 0 0.25rem;
      height: 5px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: background 0.15s;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 0.2s ease;
    }

    .individual-pings {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: var(--text-soft);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.9rem;
      max-height: 80px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .individual-pings .ping-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--surface);
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .ping-dot .ms {
      font-weight: 600;
      color: var(--text);
    }

    .ping-dot.loss {
      color: var(--error);
      opacity: 0.8;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      font-size: 0.9rem;
      gap: 0.5rem;
      padding: 1.5rem 0.5rem;
      text-align: center;
    }

    .empty-state svg {
      opacity: 0.45;
    }

    /* ----- footer note ----- */
    .privacy-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-soft);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }

    .privacy-note svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* smooth interactions */
    button, input {
      font: inherit;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="ping-card">
    <!-- header -->
    <div class="header">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="M9 12l2 2 4-4" />
      </svg>
      <h1>privacy·ping</h1>
      <span class="privacy-badge">local only</span>
    </div>
    <div class="subhead">
      <span>ICMP-like latency test</span>
      <span class="dot"></span>
      <span>no server · no logs · no tracking</span>
    </div>

    <!-- input + button -->
    <div class="input-group">
      <div class="input-wrapper">
        <label for="hostInput" class="sr-only">Hostname or IP address</label>
        <input 
          type="text" 
          id="hostInput" 
          placeholder="example.com or 8.8.8.8" 
          value="1.1.1.1"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-describedby="hostHint"
        >
      </div>
      <button class="ping-button" id="pingBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
        Ping
      </button>
    </div>

    <!-- status / progress -->
    <div class="status-row">
      <div class="status-message" id="statusMessage">
        <span>Ready</span>
      </div>
      <div id="statusBadge"></div>
    </div>

    <!-- results panel -->
    <div class="results-panel">
      <div class="results-header">
        <span>Results</span>
        <span id="targetDisplay">—</span>
      </div>

      <!-- stats grid -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-item">
          <div class="stat-label">min</div>
          <div class="stat-value" id="statMin">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">avg</div>
          <div class="stat-value" id="statAvg">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">max</div>
          <div class="stat-value" id="statMax">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">loss</div>
          <div class="stat-value" id="statLoss">—</div>
        </div>
      </div>

      <!-- progress bar -->
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <!-- individual pings -->
      <div class="individual-pings" id="pingLog">
        <div class="empty-state">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 6v6l4 2" />
          </svg>
          <span>Ping results will appear here</span>
        </div>
      </div>
    </div>

    <!-- privacy footer -->
    <div class="privacy-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      <span>all pings run in your browser · nothing is stored or sent</span>
    </div>
  </main>

  <script>
    (function() {
      'use strict';

      // --- configuration ---
      const PING_COUNT = 8;               // number of ping attempts
      const TIMEOUT_MS = 1000;            // per-ping timeout (fetch timeout)
      const PING_INTERVAL_MS = 180;       // delay between pings (ms)
      
      // --- DOM refs ---
      const hostInput = document.getElementById('hostInput');
      const pingBtn = document.getElementById('pingBtn');
      const statusMessage = document.getElementById('statusMessage');
      const statusBadge = document.getElementById('statusBadge');
      const targetDisplay = document.getElementById('targetDisplay');
      
      const statMin = document.getElementById('statMin');
      const statAvg = document.getElementById('statAvg');
      const statMax = document.getElementById('statMax');
      const statLoss = document.getElementById('statLoss');
      
      const progressFill = document.getElementById('progressFill');
      const pingLog = document.getElementById('pingLog');

      // --- state ---
      let isPinging = false;
      let abortController = null;        // to cancel ongoing pings if new request

      // --- helpers ---

      // clean hostname: remove protocol, paths, whitespace
      function sanitizeHost(raw) {
        let cleaned = raw.trim();
        if (!cleaned) return '';
        // strip protocol (http://, https://, etc.)
        cleaned = cleaned.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '');
        // remove path/query/hash
        cleaned = cleaned.split('/')[0].split('?')[0].split('#')[0];
        // remove trailing dot
        cleaned = cleaned.replace(/\.$/, '');
        // remove port (but keep IPv6 brackets? simpler: remove any :port at end)
        // For IPv6 we keep brackets if present, but strip port if after ]
        if (cleaned.startsWith('[')) {
          // ipv6: [::1]:8080 -> [::1]
          const closingBracket = cleaned.indexOf(']');
          if (closingBracket !== -1) {
            cleaned = cleaned.slice(0, closingBracket + 1);
          }
        } else {
          // ipv4 or hostname: remove :port (last colon followed by digits)
          cleaned = cleaned.replace(/:\d+$/, '');
        }
        return cleaned;
      }

      // reset stats & log
      function resetResults(targetLabel) {
        statMin.textContent = '—';
        statAvg.textContent = '—';
        statMax.textContent = '—';
        statLoss.textContent = '—';
        progressFill.style.width = '0%';
        pingLog.innerHTML = '';
        if (targetLabel) {
          targetDisplay.textContent = targetLabel;
        } else {
          targetDisplay.textContent = '—';
        }
        statusBadge.innerHTML = '';
      }

      // add a ping result entry to the log
      function addPingLogEntry(index, latencyMs, isLoss = false) {
        // remove empty state if present
        const emptyState = pingLog.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const entry = document.createElement('div');
        entry.className = 'ping-dot' + (isLoss ? ' loss' : '');
        
        if (isLoss) {
          entry.innerHTML = `<span>#${index + 1}</span><span class="ms">timeout</span>`;
        } else {
          entry.innerHTML = `<span>#${index + 1}</span><span class="ms">${latencyMs} ms</span>`;
        }
        pingLog.appendChild(entry);
        // scroll to bottom
        pingLog.scrollTop = pingLog.scrollHeight;
      }

      // update stats from array of latencies (numbers) and loss count
      function updateStats(latencies, totalSent) {
        const successful = latencies.filter(v => v !== null && !isNaN(v));
        const lossCount = totalSent - successful.length;
        const lossPercent = totalSent > 0 ? Math.round((lossCount / totalSent) * 100) : 0;

        if (successful.length === 0) {
          statMin.textContent = '—';
          statAvg.textContent = '—';
          statMax.textContent = '—';
          statLoss.textContent = totalSent > 0 ? lossPercent + '%' : '—';
          return;
        }

        const min = Math.min(...successful);
        const max = Math.max(...successful);
        const avg = Math.round(successful.reduce((a, b) => a + b, 0) / successful.length);

        statMin.textContent = min + ' ms';
        statAvg.textContent = avg + ' ms';
        statMax.textContent = max + ' ms';
        statLoss.textContent = lossPercent + '%';
      }

      // perform a single "ping" using fetch to generate network activity
      // returns latency in ms or null on failure/timeout
      async function pingOnce(host, signal) {
        // Use a tiny image request to avoid CORS? 
        // But fetch with no-cors is opaque, we just measure time until response or error.
        // Using a simple GET to a public endpoint that returns quickly is ideal.
        // We'll use the host itself with a cache-busting param, mode: no-cors.
        // However some hosts may block or hang. We set timeout via AbortController.
        
        const url = `https://${host}/?_=${Date.now()}_${Math.random().toString(36).substring(2, 8)}`;
        
        const start = performance.now();
        
        try {
          // Use HEAD or GET? GET with no-cors is fine, we don't read body.
          // But some servers reject no-cors? We just try.
          const response = await fetch(url, {
            method: 'GET',
            mode: 'no-cors',
            cache: 'no-store',
            signal: signal,
            // credentials: 'omit' — default for no-cors is omit
          });
          
          // With no-cors, we can't read status, but if we got here without error => network round trip completed
          const end = performance.now();
          return Math.round(end - start);
        } catch (err) {
          // if aborted (timeout) or network error -> loss
          if (err.name === 'AbortError') {
            return null; // timeout
          }
          return null;   // other error (DNS, connection refused, etc.)
        }
      }

      // main ping routine
      async function runPing(host) {
        if (isPinging) return;
        
        // cancel any previous ongoing pings
        if (abortController) {
          abortController.abort();
          abortController = null;
        }

        const sanitized = sanitizeHost(host);
        if (!sanitized) {
          statusMessage.innerHTML = '<span>Please enter a valid hostname or IP</span>';
          statusBadge.innerHTML = '<span class="badge-error">invalid</span>';
          resetResults('—');
          return;
        }

        // update UI: starting
        isPinging = true;
        pingBtn.disabled = true;
        hostInput.disabled = true;
        
        resetResults(sanitized);
        targetDisplay.textContent = sanitized;
        statusMessage.innerHTML = '<span class="spinner"></span><span>Pinging…</span>';
        statusBadge.innerHTML = '';

        const latencies = [];
        let completedCount = 0;
        let lossCount = 0;

        // create an AbortController for this run (to cancel timeouts)
        abortController = new AbortController();
        const signal = abortController.signal;

        // We'll manage a per-ping timeout by combining signals manually.
        // Instead, we use a separate controller for each ping timeout and link to main abort.
        
        try {
          for (let i = 0; i < PING_COUNT; i++) {
            // check if main abort was triggered (e.g., new run started)
            if (signal.aborted) break;

            // update progress
            const progressPercent = Math.round(((i) / PING_COUNT) * 100);
            progressFill.style.width = progressPercent + '%';

            // update status message with attempt count
            statusMessage.innerHTML = `<span class="spinner"></span><span>Ping ${i + 1} of ${PING_COUNT}…</span>`;

            // create a timeout controller for this ping
            const timeoutController = new AbortController();
            const timeoutId = setTimeout(() => {
              timeoutController.abort();
            }, TIMEOUT_MS);

            // link main abort to timeout controller
            const mainAbortListener = () => timeoutController.abort();
            signal.addEventListener('abort', mainAbortListener, { once: true });

            let latency = null;
            try {
              // race between ping and timeout? pingOnce already handles abort signal
              latency = await pingOnce(sanitized, timeoutController.signal);
            } catch (e) {
              // unexpected error -> loss
              latency = null;
            } finally {
              clearTimeout(timeoutId);
              signal.removeEventListener('abort', mainAbortListener);
            }

            // if main abort fired, exit loop
            if (signal.aborted) break;

            if (latency !== null && latency > 0) {
              latencies.push(latency);
              addPingLogEntry(i, latency, false);
            } else {
              lossCount++;
              addPingLogEntry(i, 0, true);
            }

            completedCount++;

            // update stats after each ping
            // build array with nulls for losses to compute loss correctly
            const displayLatencies = latencies.slice(); // successful only
            // but updateStats expects array of latencies (successful) and totalSent
            updateStats(latencies, completedCount);

            // small delay between pings (except after last)
            if (i < PING_COUNT - 1 && !signal.aborted) {
              await new Promise(resolve => setTimeout(resolve, PING_INTERVAL_MS));
            }
          }

          // final progress: 100% if completed all
          if (!signal.aborted) {
            progressFill.style.width = '100%';
            updateStats(latencies, PING_COUNT);
            
            // status message
            if (latencies.length === 0) {
              statusMessage.innerHTML = '<span>All pings timed out</span>';
              statusBadge.innerHTML = '<span class="badge-error">unreachable</span>';
            } else if (lossCount === 0) {
              statusMessage.innerHTML = '<span>Ping complete</span>';
              statusBadge.innerHTML = '<span class="badge-success">no loss</span>';
            } else {
              statusMessage.innerHTML = '<span>Ping complete</span>';
              statusBadge.innerHTML = `<span class="badge-error">${lossCount} lost</span>`;
            }
          } else {
            // aborted (new ping started)
            statusMessage.innerHTML = '<span>Ping cancelled</span>';
          }

        } catch (err) {
          console.warn('Ping error:', err);
          statusMessage.innerHTML = '<span>Ping error</span>';
          statusBadge.innerHTML = '<span class="badge-error">error</span>';
        } finally {
          // cleanup
          if (abortController) {
            abortController = null;
          }
          isPinging = false;
          pingBtn.disabled = false;
          hostInput.disabled = false;
          
          // if aborted due to new ping, don't reset status message here.
          if (!signal.aborted) {
            // final status already set above
          } else {
            // we are in a new ping, the new ping will manage UI
          }
        }
      }

      // --- event listeners ---
      pingBtn.addEventListener('click', () => {
        const host = hostInput.value;
        runPing(host);
      });

      hostInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.repeat) {
          e.preventDefault();
          runPing(hostInput.value);
        }
      });

      // initial empty state message is already present

      // prefill with a friendly host and optionally run on page load? 
      // No, we don't auto-ping (privacy). But we set a default value.
      
      // ensure that aborting on page unload doesn't cause issues
      window.addEventListener('beforeunload', () => {
        if (abortController) {
          abortController.abort();
        }
      });

      // small additional privacy: never send referrer
      // (meta tag not possible for all, but fetch with no-referrer policy)
      // we can set meta referrer policy
      const metaReferrer = document.createElement('meta');
      metaReferrer.name = 'referrer';
      metaReferrer.content = 'no-referrer';
      document.head.appendChild(metaReferrer);

      // also set a noopener for any potential window? not needed.

      // make sure the input is not sending data anywhere
      // all good.
    })();
  </script>
  <script src="https://support.jao.life/support.js" defer></script>
</body>
